name: CI
on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
      - name: Static and core checks
        run: pixi run check
      - name: HTTP smoke test on port 4425
        shell: bash
        run: |
          pixi run dev > /tmp/towerdefnapst.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4425/ > /tmp/index.html; then
              break
            fi
            sleep 1
          done
          grep -q "THE BATTLEFIELD UPDATE" /tmp/index.html
          curl --fail --silent http://127.0.0.1:4425/src/main.js -o /tmp/main.js
          grep -q "new Game" /tmp/main.js
          curl --fail --silent http://127.0.0.1:4425/src/render/Renderer.js -o /tmp/renderer.js
          grep -q "new THREE.WebGLRenderer" /tmp/renderer.js
          curl --fail --silent http://127.0.0.1:4425/src/render/CameraController.js -o /tmp/camera.js
          grep -q "GAMEPLAY_PITCH_MIN" /tmp/camera.js
